spring.application.name=ProjectHub
spring.thymeleaf.prefix=classpath:/views/
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/
spring.thymeleaf.cache=false

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/projecthub}
spring.datasource.username=${DB_USERNAME:projecthub}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false


