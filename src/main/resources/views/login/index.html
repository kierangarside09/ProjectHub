<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>ProjectHub | Log in</title>
    <meta name="description" content="ProjectHub — a home for your next big idea.">
</head>
<body>
<main layout:fragment="content" class="login-page">

    <section class="heading-section" aria-labelledby="login-heading">
        <p class="eyebrow">Welcome back</p>
        <h1 id="login-heading">Log in to<br>ProjectHub</h1>
        <p class="description">Pick up where you left off and keep building with your team.</p>
    </section>

    <section class="form-section">
        <p th:if="${param.error != null}" class="error">Invalid email or password.</p>
        <p th:if="${param.registered != null}" class="notice">Account created — please log in.</p>

        <form class="auth-form" th:action="@{/login}" method="post">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
            <button class="button" type="submit">Log in</button>
        </form>

        <p class="auth-switch">Don't have an account? <a th:href="@{/register}">Register</a></p>
    </section>

</main>
</body>
</html>
