<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectHub</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="container">
        <header>
            <a class="brand" th:href="@{/}">Project<span>Hub</span></a>
            <nav class="nav-links" aria-label="Main navigation">
                <a sec:authorize="isAnonymous()" th:href="@{/login}">Log in</a>
                <a sec:authorize="isAnonymous()" th:href="@{/register}">Register</a>
                <a sec:authorize="isAuthenticated()" th:href="@{/create}">Create a project</a>
                <a sec:authorize="isAuthenticated()" th:href="@{/profile}">My profile</a>
                <span sec:authorize="isAuthenticated()" class="nav-user" sec:authentication="name"></span>
                <form sec:authorize="isAuthenticated()" class="logout-form" th:action="@{/logout}" method="post">
                    <button class="logout-button" type="submit">Log out</button>
                </form>
            </nav>
        </header>
        <main layout:fragment="content"></main>
        <footer>ProjectHub &mdash; Your next chapter starts here.</footer>
    </div>
</body>
</html>
