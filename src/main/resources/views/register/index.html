<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>ProjectHub | Register</title>
    <meta name="description" content="ProjectHub — a home for your next big idea.">
</head>
<body>
<main layout:fragment="content" class="register-page">

    <section class="heading-section" aria-labelledby="register-heading">
        <p class="eyebrow">Join ProjectHub</p>
        <h1 id="register-heading">Create your<br>account</h1>
        <p class="description">Sign up to post projects and find collaborators to build with.</p>
    </section>

    <section class="form-section">
        <form class="auth-form" th:object="${registerForm}" th:action="@{/register}" method="post">
            <label for="displayName">Display name:</label>
            <input type="text" id="displayName" th:field="*{displayName}" placeholder="Display name" autocomplete="nickname">
            <p th:errors="*{displayName}" class="error"></p>

            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{email}" placeholder="Email" autocomplete="email">
            <p th:errors="*{email}" class="error"></p>

            <label for="password">Password:</label>
            <input type="password" id="password" th:field="*{password}" placeholder="Password" autocomplete="new-password">
            <p th:errors="*{password}" class="error"></p>

            <label for="confirmPassword">Confirm password:</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Confirm password" autocomplete="new-password">
            <p th:errors="*{confirmPassword}" class="error"></p>

            <button class="button" type="submit">Register</button>
        </form>

        <p class="auth-switch">Already have an account? <a th:href="@{/login}">Log in</a></p>
    </section>

</main>
</body>
</html>
