<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>ProjectHub | New Project</title>
    <meta name="description" content="ProjectHub — a home for your next big idea.">

    <link rel="stylesheet" th:href="@{/css/flexdatalist.css}">

    <script th:src="@{/js/flexdatalist.umd.js}" defer></script>
</head>
<body>
<main layout:fragment="content" class="new-project-page">

    <section class="heading-section" aria-labelledby="new-project-heading">
        <h1 id="page-title">Create a<br>new project</h1>
        <p class="description">Create a new project and invite your team members to collaborate.</p>
    </section>

    <section class="form-section">
        <form th:action="@{/create}" method="post">
            <div class="flex flex-col">
                <div class="flex flex-col">
                    <label for="projectName_input" class="block">Project Name:</label>
                    <input class="w-3xs" type="text" id="projectName_input" name="name" placeholder="Project Name">
                </div>
                <div class="flex flex-col">
                    <label for="projectSmallDescription_input">Small Project Description:</label>
                    <textarea id="projectSmallDescription_input" name="smallDescription" placeholder="Short Project Description"></textarea>
                </div>
                <div class="flex flex-col">
                    <label for="projectTags_input">Project Tags:</label>
                    <input
                        class="flexdatalist"
                        type="text"
                        id="projectTags_input"
                        name="tags"
                        data-data="/data/tags-presets.json"
                        data-min-length="0"
                        data-multiple="true"
                        data-search-contain="true"
                        placeholder="Add tags..."
                        >
                </div>
                <div class="flex flex-col">
                    <label for="projectCreator_input">Project Creator:</label>
                    <input class="w-3xs" type="text" id="projectCreator_input" name="creator" placeholder="John Doe">
                </div>
                <div class="flex flex-col">
                    <label for="projectStage_input">Project Stage:</label>
                    <input
                            class="flexdatalist"
                            type="text"
                            id="projectStage_input"
                            name="stage"
                            data-data="/data/stages-presets.json"
                            data-min-length="0"
                            data-search-contain="true"
                            placeholder="Current Stage"
                    >
                </div>
                <div class="flex flex-col">
                    <label for="projectLookingFor_input">Looking For:</label>
                    <input
                            class="flexdatalist"
                            type="text"
                            id="projectLookingFor_input"
                            name="lookingFor"
                            data-data="/data/looking-for-presets.json"
                            data-min-length="0"
                            data-multiple="true"
                            data-search-contain="true"
                            placeholder="Roles..."
                    >
                </div>
                <div class="flex flex-col">
                    <label for="projectFullDescription_input">Full Project Description:</label>
                    <textarea id="projectFullDescription_input" name="fullDescription" placeholder="Extended Project Description"></textarea>
                </div>
            </div>

            <button class="button" type="submit">Create Project</button>
        </form>
    </section>

</main>
</body>
</html>
